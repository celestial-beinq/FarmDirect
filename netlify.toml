# Netlify build settings. The Angular runtime plugin (@netlify/angular-runtime)
# is picked up automatically and turns src/server.ts into an Edge Function.
#
# Set these in Netlify → Site configuration → Environment variables
# (scripts/set-env.mjs reads them during `npm run build`):
#   SUPABASE_URL, SUPABASE_ANON_KEY
# Never add the Supabase service_role key or the Paystack secret key here;
# those belong to the Supabase edge functions (`supabase secrets set`).

[build]
  command = "npm run build"
  publish = "dist/FarmDirect/browser"

[build.environment]
  NODE_VERSION = "22"
  # Marks the generated environment.ts as production (turns off demo sign-in).
  # Don't use NODE_ENV=production here: Netlify would then skip devDependencies
  # that the build needs.
  PRODUCTION = "true"

# Security headers for files served straight from Netlify's CDN (scripts,
# styles, images, prerendered pages). Server-rendered pages get the same
# headers from src/server.ts — keep the two lists in sync.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://*.paystack.co\")"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' https://*.paystack.co https://checkout.paystack.com"

# Hashed build files never change, so browsers can keep them for a year.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos may be replaced under the same name, so cache them for a week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
